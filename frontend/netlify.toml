[build]
  # The directory containing compiled static files to serve (relative to the base directory)
  publish = "dist"

  # The command executed to build the frontend
  command = "npm run build"

[build.environment]
  # Disable Netlify's secret scanner to prevent false positive build failures on public variables (like VITE_API_URL and VITE_SUPABASE_PUBLISHABLE_KEY)
  SECRETS_SCAN_ENABLED = "false"


[[redirects]]
  # Redirect all requests to index.html for client-side routing (React Router)
  from = "/*"
  to = "/index.html"
  status = 200
