[build]
  # The directory where Netlify runs the build (contains frontend package.json)
  base = "frontend"

  # The directory containing compiled static files to serve (relative to the base directory)
  publish = "dist"

  # The command executed to build the frontend
  command = "npm run build"

[build.environment]
  # Skip Next.js runtime plugin since this Netlify site only deploys the Vite frontend
  NETLIFY_NEXT_PLUGIN_SKIP = "true"

